# The frontend container's own nginx config. Deliberately minimal: your HOST nginx
# (Certbot/TLS, the vikramads.in server blocks, the backend_servers upstream) already
# owns routing, HTTPS, and proxying /api + /socket.io straight to the backend replicas --
# this container only ever receives traffic the host nginx forwards to 127.0.0.1:8080,
# and it only has one job: serve the built app and fall back to index.html for
# client-side routing.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
