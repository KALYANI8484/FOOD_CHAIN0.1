name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Typecheck, Build, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck (frontend) — non-blocking until pre-existing errors are cleared
        run: npm run typecheck
        continue-on-error: true

      - name: Syntax-check backend
        run: node --check server.js

      - name: Build
        run: npm run build

      - name: Lint (non-blocking until the existing `any`-cast backlog is cleared)
        run: npm run lint
        continue-on-error: true
